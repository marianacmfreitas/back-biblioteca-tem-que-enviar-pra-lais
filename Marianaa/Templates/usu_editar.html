<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Editar Usuário</title>
    <link rel='stylesheet' href="{{ url_for('static',filename='usu_editar.css')}}">
</head>
<body>

    <header>
        <h1>Biblioteca</h1>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-messages">
                    {% for category, message in messages %}
                        <div class="flash {{ category }}">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}
    </header>

    <h2>Editar Usuário</h2>

    <form action="{{ url_for('editares', id=usuario[0]) }}" method="post">

        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" value="{{ usuario[1] }}" required>

        <label for="email">Email:</label>
        <input type="text" id="email" name="email" value="{{ usuario[2] }}" required>

        <label for="senha">Senha:</label>
        <input type="text" id="senha" name="senha" value="{{ usuario[3] }}" required>

        <div>
            <button type="submit" class="btn">Salvar</button>
        </div>

    </form>

</body>
</html>
